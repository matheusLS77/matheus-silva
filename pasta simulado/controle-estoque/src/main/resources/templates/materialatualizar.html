<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestão de Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <link rel="shortcut icon" href="/images/iconeAzul-stock.png" type="image/x-icon">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-page" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">
            <img src="/images/icone-stock.png" alt="Logo" class="d-inline-block align-text-top mt-1 me-1 icone-logo"> Gestão de Estoque
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto nav-underline">
                <li class="nav-item">
                    <a class="nav-link text-light-emphasis" aria-current="page" th:href="@{/home}">Início</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active text-light-emphasis" th:href="@{/materiaislista}">Materiais</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-light-emphasis" th:href="@{/categorialista}">Categorias</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-light-emphasis" th:href="@{/movimentacaolista}">Movimentações</a>
                </li>

                <div class="dropdown">
                    <button class="btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <span th:text="${usuarioLogin}">Usuário</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/logout}">Sair</a></li>
                    </ul>
                </div>

            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1">Atualizar Material</h1>
                    <p class="text-secondary mb-0">Preencha os dados para atualizar o material.</p>
                </div>
            </div>

            <div class="card shadow-sm border-0 outline-0">
                <div class="card-body">
                    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                    <form th:action="@{/materialatualizar}" th:object="${material}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="nome" class="form-label fw-medium">Nome</label>
                            <input type="text" class="form-control" id="nome" th:field="*{nome}" placeholder="Digite o nome do material">

                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro no nome
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="codigo" class="form-label fw-medium">Código</label>
                            <input type="text" class="form-control" id="codigo" th:field="*{codigo}" placeholder="Digite o código do material">

                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}">Erro no código
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="quantidadeEstoque" class="form-label fw-medium">Quantidade em estoque</label>
                            <input type="number" class="form-control" id="quantidadeEstoque" th:field="*{quantidadeEstoque}" placeholder="Digite a quantidade em estoque">

                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('quantidadeEstoque')}" th:errors="*{quantidadeEstoque}">Erro na quantidade em estoque
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="estoqueMinimo" class="form-label fw-medium">Estoque mínimo</label>
                            <input type="number" class="form-control" id="estoqueMinimo" th:field="*{estoqueMinimo}" placeholder="Digite o estoque mínimo">

                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('estoqueMinimo')}" th:errors="*{estoqueMinimo}">Erro no estoque mínimo
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="idCategoria" class="form-label fw-medium">Categoria</label>
                            <select class="form-select" id="idCategoria" th:field="*{idCategoria}">

                                <option value="">Selecione uma categoria</option>

                                <option th:each="categoria : ${categorias}"
                                        th:value="${categoria.id}"
                                        th:text="${categoria.nome}">
                                </option>
                            </select>

                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('idCategoria')}" th:errors="*{idCategoria}">Erro na categoria
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a class="btn btn-outline-secondary" th:href="@{/materiaislista}">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
