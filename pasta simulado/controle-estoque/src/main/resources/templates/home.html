<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de Estoque</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <link rel="shortcut icon" href="/images/iconeAzul-stock.png" type="image/x-icon">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-page" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/home}">
      <img src="/images/icone-stock.png" alt="Logo" class="d-inline-block align-text-top mt-1 me-1 icone-logo"> Gestão de Estoque
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav ms-auto nav-underline">
        <li class="nav-item">
          <a class="nav-link active text-light-emphasis" aria-current="page" th:href="@{/home}">Início</a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-light-emphasis" th:href="@{/materiaislista}">Materiais</a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-light-emphasis" th:href="@{/categorialista}">Categorias</a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-light-emphasis" th:href="@{/movimentacaolista}">Movimentações</a>
        </li>

        <div class="dropdown">
          <button class="btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <span th:text="${usuarioLogin}">Usuário</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" th:href="@{/logout}">Sair</a></li>
          </ul>
        </div>

      </ul>
    </div>
  </div>
</nav>

<main class="container py-5">
  <div class="p-4 mt-4 mb-4 bg-light rounded-4 shadow-sm">
    <div class="container-fluid py-3">
      <h2 class="fw-bold mb-1">
        Bem-vindo, <span th:text="${usuarioLogin}">Usuário</span>!
      </h2>
      <p class="text-secondary mb-4">Visão geral do estoque</p>

      <div class="row g-3">

        <div class="col-12 col-md-4">
          <div class="card h-100 border-0 shadow-sm rounded-3">
            <div class="card-body text-center py-4 rounded-3" style="background-color: #e9ecef !important;">
              <h5 class="card-title text-secondary">Materiais</h5>
              <p class="display-6 fw-bold mb-0" th:text="${totalMateriais}">25</p>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-4">
          <div class="card h-100 border-0 shadow-sm rounded-3">
            <div class="card-body text-center py-4 rounded-3" style="background-color: #e9ecef !important;">
              <h5 class="card-title text-secondary">Categorias</h5>
              <p class="display-6 fw-bold mb-0" th:text="${totalCategorias}">6</p>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-4">
          <div class="card h-100 border-0 shadow-sm rounded-3">
            <div class="card-body text-center py-4 rounded-3" style="background-color: #e9ecef !important;">
              <h5 class="card-title text-secondary">Estoque baixo</h5>
              <p class="display-6 fw-bold mb-0" th:text="${totalEstoqueBaixo}">3</p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
