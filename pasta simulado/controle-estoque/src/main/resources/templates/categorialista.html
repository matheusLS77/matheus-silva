<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestão de Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <link rel="shortcut icon" href="/images/iconeAzul-stock.png" type="image/x-icon">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-page" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">
            <img src="/images/icone-stock.png" alt="Logo" class="d-inline-block align-text-top mt-1 me-1 icone-logo"> Gestão de Estoque
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto nav-underline">
                <li class="nav-item">
                    <a class="nav-link text-light-emphasis" aria-current="page" th:href="@{/home}">Início</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-light-emphasis" th:href="@{/materiaislista}">Materiais</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active text-light-emphasis" th:href="@{/categorialista}">Categorias</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-light-emphasis" th:href="@{/movimentacaolista}">Movimentações</a>
                </li>

                <div class="dropdown">
                    <button class="btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <span th:text="${usuarioLogin}">Usuário</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/logout}">Sair</a></li>
                    </ul>
                </div>

            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="w-75 mx-auto mb-4">
        <div>
            <h1 class="h3 mb-1">Categorias</h1>
            <p class="text-secondary mb-0">Lista de categorias cadastradas no sistema.</p>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <form class="d-flex" role="search" th:action="@{/categorialista}" method="get">
                <div class="position-relative">
                    <input class="form-control rounded-pill pe-5" type="search" name="categoria" placeholder="Buscar categoria..." aria-label="Buscar categoria">

                    <button class="btn position-absolute top-50 end-0 translate-middle-y me-2 border-0" type="submit">
                        <img src="/images/search.svg" alt="Buscar" width="15" height="15">
                    </button>
                </div>
            </form>

            <a class="btn btn-primary d-inline-flex align-items-center gap-2" th:href="@{/categoriacadastrar}">
                <img src="/images/whiteplus.png" alt="Novo" class="icone-icon"> Nova categoria</a>
        </div>
    </div>

    <div class="alert alert-success" role="alert" th:if="${mensagem}" th:text="${mensagem}">
        Categoria salva com sucesso.
    </div>

    <div class="card shadow-sm card shadow-sm rounded-3 overflow-hidden border-0 outline-0 w-75 mx-auto">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped align-middle mb-0">
                    <thead class="table-primary">
                    <tr>
                        <th class="text-center" style="width: 10%;">ID</th>
                        <th style="width: 70%;">Nome</th>
                        <th style="width: 20%;" class="text-end">Ações</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="categoria : ${categorias}">
                        <td class="text-center" th:text="${categoria.id}">1</td>
                        <td th:text="${categoria.nome}">Nome</td>

                        <td class="text-end">
                            <a class="btn btn-sm btn-primary me-1" th:href="@{/categoriaatualizar/{id}(id=${categoria.id})}">Editar</a>
                            <button th:if="${tipoUsuario != null and tipoUsuario.name() == 'ADMINISTRADOR'}" class="btn btn-sm btn-danger excluirCategoria"
                                    th:data-id="${categoria.id}">
                                Excluir
                            </button>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(categorias)}">
                        <td colspan="10" class="text-center text-secondary py-4">Nenhuma categoria cadastrada.</td>
                    </tr>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="/js/excluir_categoria.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
